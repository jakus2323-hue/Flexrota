<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexrota</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      opacity: 0.8;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #6b7280;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Flexrota</h1>
    <p>Simple staff rota management</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome to Flexrota</h2>

      <p>
        Manage your team's shifts, see who's working,
        and keep track of shift confirmations.
      </p>

      <div class="buttons">
        <button onclick="alert('Rota coming next!')">
          View Rota
        </button>

        <button class="secondary" onclick="alert('Employee management coming next!')">
          Employees
        </button>
      </div>
    </section>

  </main>

  <footer>
    Flexrota &copy; 2026
  </footer>

</body>
</html>
